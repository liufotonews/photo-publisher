name: Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Tauri system dependencies (Ubuntu)
        # publisher-desktop links webkit2gtk when built on Linux; the crate is
        # a workspace member, so the Ubuntu lane needs these system packages.
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Phase 6-E.3 validation: one deterministic Windows run covering format,
  # tests, clippy, CLI behavior (help/verbose/silent/json/dry-run/
  # idempotency), and the frozen-file check against tag v0.1.0. No real
  # credentials are needed; the fixture uses the local-only project contract.
  verify-phase6e:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The full history is required so tag v0.1.0 is available for the
          # frozen-file comparison.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify Phase 6-E
        shell: pwsh
        run: scripts/verify-phase6e.ps1

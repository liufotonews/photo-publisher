[package]
name = "publisher-provisioner-github"
version = "0.1.0"
edition = "2021"
description = "GitHub RepositoryProvisioner for Photo Publisher (infrastructure only, never content)."

[dependencies]
publisher-provisioning = { path = "../provisioning" }
photo-publisher-provider-contracts = { path = "../provider-contracts" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"

[dev-dependencies]
mockito = "1"

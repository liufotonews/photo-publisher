[package]
name = "publisher-provisioner-vercel"
version = "0.1.0"
edition = "2021"
description = "Vercel HostingProvisioner for Photo Publisher (project infrastructure only, never deployments)."

[dependencies]
publisher-provisioning = { path = "../provisioning" }
photo-publisher-provider-contracts = { path = "../provider-contracts" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"

[dev-dependencies]
mockito = "1"

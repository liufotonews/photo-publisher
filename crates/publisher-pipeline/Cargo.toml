[package]
name = "photo-publisher-pipeline"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
tempfile = "3.27"
sha2 = "0.10"
photo-publisher-core = { path = "../publisher-core" }
photo-publisher-contract-validator = { path = "../contract-validator" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]

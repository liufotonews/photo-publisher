[package]
name = "photo-publisher-provider-github"
version = "0.1.0"
edition = "2021"

[dependencies]
photo-publisher-provider-contracts = { path = "../provider-contracts" }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
photo-publisher-provider-contract-tests = { path = "../provider-contract-tests" }
mockito = "1"

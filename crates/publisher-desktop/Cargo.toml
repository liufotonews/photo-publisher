[package]
name = "publisher-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"
default-run = "publisher-desktop"

[lib]
name = "publisher_desktop"
path = "src/lib.rs"

# The Tauri runtime links platform webview libraries that require a display
# environment; the binary produces the actual application and is covered by
# build/clippy checks, while the library and integration tests stay free of
# any webview dependency.
[[bin]]
name = "publisher-desktop"
path = "src/main.rs"
test = false

[dependencies]
publisher-app = { path = "../publisher-app" }
photo-publisher-integration = { path = "../publisher-integration" }
photo-publisher-provider-contracts = { path = "../provider-contracts" }
photo-publisher-provider-github = { path = "../provider-github" }
photo-publisher-provider-r2 = { path = "../provider-r2" }
photo-publisher-provider-vercel = { path = "../provider-vercel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
image = "0.25"
tempfile = "3"

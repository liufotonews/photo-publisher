[package]
name = "photo-publisher-cli"
version = "0.1.0"
edition = "2021"
default-run = "photo-publisher"

[[bin]]
name = "photo-publisher"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
photo-publisher-core = { path = "../publisher-core" }
photo-publisher-pipeline = { path = "../publisher-pipeline" }
photo-publisher-contract-validator = { path = "../contract-validator" }
photo-publisher-integration = { path = "../publisher-integration" }
photo-publisher-provider-contracts = { path = "../provider-contracts" }
photo-publisher-provider-github = { path = "../provider-github" }
photo-publisher-provider-r2 = { path = "../provider-r2" }
photo-publisher-provider-vercel = { path = "../provider-vercel" }
publisher-app = { path = "../publisher-app" }

[dev-dependencies]
tempfile = "3.27"
image = "0.25"
